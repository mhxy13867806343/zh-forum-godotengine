<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/godot-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Godot 中文论坛 - 开源游戏引擎社区</title>
    <meta name="description" content="Godot 中文论坛，连接官方论坛数据与中文社区，汇聚问答求助、游戏作品展示、插件资源与实战教程。" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('godot_zh_theme')
          if (saved === 'light') {
            document.documentElement.classList.remove('dark')
            document.documentElement.setAttribute('data-theme', 'light')
          } else {
            document.documentElement.classList.add('dark')
            document.documentElement.setAttribute('data-theme', 'dark')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
